name: mvp-saas-ventilacoes

services:
  postgres:
    image: postgres:16-alpine
    container_name: vs-postgres
    environment:
      POSTGRES_USER: app_migrator
      POSTGRES_PASSWORD: app_migrator
      POSTGRES_DB: ventilacoes
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_migrator -d ventilacoes"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    container_name: vs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    profiles: ["storage"]
    image: minio/mc:latest
    container_name: vs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/ventilacoes;
      mc anonymous set none local/ventilacoes;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: vs-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  minio_data:
